name: Validate analysis
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-lock.txt
      - run: python run.py
      - run: python -m pytest -q
      - run: python src/validate_powerbi.py
