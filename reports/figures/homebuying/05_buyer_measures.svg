   <g id="text_28">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1c2d29" transform="translate(544.766897 129.598242)">First five years' interest:</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1c2d29" transform="translate(544.766897 140.4)">CAD 193,345 vs CAD 196,837</text>
