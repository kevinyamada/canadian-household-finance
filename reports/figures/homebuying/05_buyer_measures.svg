  <g id="text_29">
   <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1c2d29" x="51.84" y="36.796875" transform="rotate(-0 51.84 36.796875)">Buyer measures help, with different trade-offs.</text>
  </g>
  <g id="text_30">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #54635e" x="51.84" y="64.298437" transform="rotate(-0 51.84 64.298437)">Vancouver two-earner example; all comparisons are conditional on eligibility.</text>
  </g>
  <g id="text_31">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #54635e" transform="translate(51.84 482.079531)">BC relief reduces transfer tax; 30 years lowers payments but increases insured premium and first-five-year interest. HBP uses existing RRSP wealth</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #54635e" transform="translate(51.84 491.681719)">(CAD 40,000 here), with future repayments. *FHSA compares two cases after identical 12-month saving: CAD 16,000 contributed from that saving is</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #54635e" transform="translate(51.84 501.283906)">counted once; only an assumed 30% refund adds CAD 4,800. No free funds or guaranteed refund is assumed. All four comparisons retain an income</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #54635e" transform="translate(51.84 510.886094)">shortfall in this example.</text>
  </g>
  <g id="text_32">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #54635e" x="51.84" y="521.1" transform="rotate(-0 51.84 521.1)">Kevin Yamada | Canadian Household Finance | Official Canadian public sources</text>
  </g>
