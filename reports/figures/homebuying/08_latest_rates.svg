   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #54635e" x="51.84" y="64.298437" transform="rotate(-0 51.84 64.298437)">Same 2023 purchase price, property-tax schedule and buyer finances; newer monthly national rates replace the 2023 annual benchmark.</text>
  </g>
  <g id="text_35">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #54635e" transform="translate(51.84 482.079531)">Latest rate period: 2026-09. Bank of Canada funds-advanced fixed 5-year-and-over series V122667780/786. Monthly rates are not annual averages or</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #54635e" transform="translate(51.84 491.681719)">borrower offers. The latest reviewed Statistics Canada buyer release still uses 2023 transactions and income. This isolates rates and does not measure</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #54635e" transform="translate(51.84 501.283906)">current-market affordability. Profile income, cash, historical tax schedule and other costs stay fixed.</text>
  </g>
  <g id="text_36">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #54635e" x="51.84" y="521.1" transform="rotate(-0 51.84 521.1)">Kevin Yamada | Canadian Household Finance | Official Canadian public sources</text>
  </g>
 </g>
