  <g id="text_18">
   <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1c2d29" x="51.84" y="36.796875" transform="rotate(-0 51.84 36.796875)">Saving longer helps only if the target does not outrun it.</text>
  </g>
  <g id="text_19">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #54635e" x="51.84" y="64.298437" transform="rotate(-0 51.84 64.298437)">Vancouver two-earner illustration: save CAD 2,000/month initially; annual rent growth 3%; income and mortgage rates fixed.</text>
  </g>
  <g id="text_20">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #54635e" transform="translate(51.84 482.079531)">Price changes are hypothetical paths, not forecasts or probabilities. Higher rent reduces the initially stated net saving; cash earns zero interest.</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #54635e" transform="translate(51.84 491.681719)">Closing costs and loan-insurance tiers are recalculated at each price. Starting point is the 2023 transaction benchmark with rules reviewed November</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #54635e" transform="translate(51.84 501.283906)">16, 2026. This is a sensitivity study, not a recommendation to buy or wait.</text>
  </g>
  <g id="text_21">
